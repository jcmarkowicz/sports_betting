[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ufc-betting"
version = "0.1.0"
description = "UFC data collection, modeling, and betting analysis"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
